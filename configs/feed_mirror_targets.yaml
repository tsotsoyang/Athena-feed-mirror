# Athena-feed-mirror targets — feeds that Athena's egress can't reach
# but GitHub-Actions egress can. See README.md for the shape contract.
#
# Add new entries here; the runner picks them up on the next 30-min cron.
# `source` doubles as the JSON filename — keep it lowercase + hyphen-only.

targets:
  - source: meta-ai-research
    name: Meta AI Research
    url: https://ai.meta.com/blog/rss/
    fallback_urls:
      - https://ai.meta.com/blog/
    max_entries: 25
    scrape:
      index_url: https://ai-meta-com.translate.goog/blog/?_x_tr_sl=zh-CN&_x_tr_tl=en&_x_tr_hl=en
      link_prefix: /blog/
      canonical_host: ai.meta.com
    notes: |
      Cloudflare WAF / TLS-fingerprint rejects Athena-egress AND the
      GH runner (0 entries since round 1) — feed first, then scrape
      the blog index through the Google-Translate proxy host with
      canonical_host rewriting URLs back to ai.meta.com.

  - source: arxiv-sanity-lite
    name: ArXiv-sanity Lite (top recent)
    url: https://arxiv-sanity-lite.com/?rank=time
    fallback_urls:
      - https://arxiv-sanity-lite.com/rss
    max_entries: 30
    notes: |
      No documented RSS endpoint; relies on autodiscovery of the
      <link rel="alternate"> tag that the SSR HTML emits. Geo / WAF
      blocks Athena-egress.

  - source: esmchina
    name: ESM China
    url: https://www.esmchina.com/rss
    fallback_urls:
      - https://www.esmchina.com/feed
      - https://www.esmchina.com/
    max_entries: 25
    notes: |
      12 s+ timeout from Athena Phison checkout. Used to be on
      manual_only in Athena catalog; once this mirror is live, flip
      back to ready-to-fetch via the `mirrored_feed` source kind.

  - source: skhynix-newsroom
    name: SK hynix Newsroom
    url: https://news.skhynix.com/feed/
    fallback_urls: []
    max_entries: 25
    notes: |
      Documented gotcha in Athena CLAUDE.md — would kill the whole
      rss_blog batch if included direct. Mirroring it here makes the
      content available to Athena without the timeout poisoning.

  # 2026-05-31 — added per Item 4/7 of source-expansion sweep.
  # Both sites are WordPress / CMS-managed, so /feed/ paths usually
  # work even when not documented. Multiple fallback URLs let the
  # runner probe paths until one returns parseable XML; the
  # autodiscovery layer adds one more recovery step via the page's
  # <link rel="alternate"> tag. If none resolve, the per-target
  # error isolation means these don't poison the other mirrors.

  - source: cxl-consortium-news
    name: CXL Consortium press room
    url: https://computeexpresslink.org/news/feed/
    fallback_urls:
      - https://computeexpresslink.org/feed/
      - https://computeexpresslink.org/news/
      - https://computeexpresslink.org/
    max_entries: 25
    notes: |
      CXL Consortium press room at /news/ — direct signal for CXL
      spec releases (3.2, 4.0, etc.) and ecosystem announcements.
      WebFetch from Athena returned no RSS link in the rendered page
      (probably JS-hydrated), so the runner relies on the WordPress
      /feed/ convention + autodiscovery fallback. Critical input for
      Athena's CXL-PIM topic which currently produces 0 entries.

  - source: ocp-news
    name: Open Compute Project news
    url: https://www.opencompute.org/news/feed/
    fallback_urls:
      - https://www.opencompute.org/feed/
      - https://www.opencompute.org/news/
      - https://www.opencompute.org/projects/storage/
    max_entries: 30
    notes: |
      OCP news + storage / NVMe / server announcements. Important
      because OCP Inspired™ certifications (Sandisk PCIe Gen5
      SN861, SMART Modular DC4800, etc.) signal which SSDs land in
      hyperscale fleets — direct input for the NAND_Flash topic.
      Mirror keeps the runner away from any geo-WAF surprises.

  # 2026-07-19 — frontier-lab blogs blocked at the Phison egress
  # (curl connect-fail 000 from the corporate network). Mirrored so
  # Athena's LLM topics get the OFFICIAL announcement posts (model
  # releases, tech blogs) instead of only second-hand Google News.

  - source: kimi-blog
    name: Moonshot AI / Kimi Blog
    url: https://www.kimi.com/blog/rss.xml
    fallback_urls:
      - https://www.kimi.com/blog/feed
      - https://www.kimi.com/feed
      - https://www.kimi.com/blog
    max_entries: 25
    scrape:
      index_url: https://www.kimi.com/blog
      link_prefix: /blog/
    notes: |
      kimi.com is connection-blocked from the Phison egress. No RSS
      at all (verified 2026-07-19: autodiscovery finds nothing), but
      the /blog index IS server-rendered — the `scrape` fallback
      extracts the post anchors and enriches each post with its
      <title> + meta description. Primary channel for Kimi K3 /
      K-series release posts (e.g. /blog/kimi-k3).

  - source: openai-news
    name: OpenAI News
    url: https://openai.com/news/rss.xml
    fallback_urls:
      - https://openai.com/blog/rss.xml
      - https://openai.com/news/
    max_entries: 25
    notes: |
      openai.com is connection-blocked from the Phison egress (the
      direct rss_blog subscription in Athena's LLM topics silently
      yields 0). The /news/rss.xml feed is documented and worked
      before the block.

  - source: zai-blog
    name: Z.ai (Zhipu) Blog
    url: https://z.ai/blog/rss.xml
    fallback_urls:
      - https://z.ai/rss.xml
      - https://z.ai/blog
    max_entries: 25
    scrape:
      index_url: https://z-ai.translate.goog/blog?_x_tr_sl=zh-CN&_x_tr_tl=en&_x_tr_hl=en
      link_prefix: /blog/
      canonical_host: z.ai
    notes: |
      z.ai (Zhipu / GLM) is connection-blocked from the Phison
      egress. No RSS anywhere on the host, so the feed-first config
      this target shipped with could never yield: every published
      artefact from 2026-07-19 to 2026-08-17 was `entries: 0` with
      `errors: [autodiscovery x3, fetch]`, and because a mirror that
      answers with an empty list is not an error on Athena's side,
      GLM quietly had no official channel at all for a month — only
      second-hand Google News.

      Fixed in two steps, both measured. Adding a `scrape` block (as
      kimi-blog has) moved the error from "all candidate URLs
      returned 0 entries" to "index fetch failed: https://z.ai/blog"
      — i.e. the scrape ran, and z.ai's WAF rejects the GH-runner IP
      outright, the same way x.ai's does. So the index goes through
      the Google-Translate proxy host like xai-news, with
      canonical_host rewriting emitted URLs back to z.ai.
      (sl=zh-CN/tl=en leaves English text untouched.)

      If a future run reports "no matching anchors on index page"
      instead, the proxy fetch is now succeeding and the index is
      client-rendered — that needs a different mechanism (the docs
      changelog, or GitHub releases on zai-org once that org starts
      cutting them), not a deletion of this target.

  - source: mistral-news
    name: Mistral AI News
    url: https://mistral.ai/feed.xml
    fallback_urls:
      - https://mistral.ai/rss.xml
      - https://mistral.ai/news
    max_entries: 25
    notes: |
      mistral.ai is connection-blocked from the Phison egress. No
      documented RSS — rely on fallback probes + autodiscovery on
      the /news page.

  # 2026-07-19 pt.2 — full source-sweep additions. All four hosts are
  # connection-blocked at the Phison egress; none has a reachable RSS
  # from there. Feed-first with scrape fallback where the index is
  # server-rendered; per-target error isolation as usual.

  - source: deepseek-news
    name: DeepSeek News
    url: https://api-docs.deepseek.com/news
    fallback_urls: []
    max_entries: 25
    scrape:
      index_url: https://api-docs.deepseek.com/news
      link_prefix: /news/
    notes: |
      DeepSeek official news (docusaurus, server-rendered). Blocked
      at the Phison egress; previously only second-hand Google News
      covered DeepSeek releases.

  - source: xai-news
    name: xAI News
    url: https://x.ai/news
    fallback_urls:
      - https://x.ai/feed.xml
      - https://x.ai/rss.xml
    max_entries: 25
    scrape:
      index_url: https://x-ai.translate.goog/news?_x_tr_sl=zh-CN&_x_tr_tl=en&_x_tr_hl=en
      link_prefix: /news/
      canonical_host: x.ai
    notes: |
      xAI (Grok) announcements. Blocked at the Phison egress AND the
      Cloudflare WAF rejects direct GH-runner fetches of x.ai — so the
      scrape index goes through the Google-Translate proxy host
      (sl=zh-CN/tl=en leaves the English text untouched) and
      canonical_host rewrites emitted URLs back to x.ai.

  - source: deepmind-blog
    name: Google DeepMind Blog
    url: https://deepmind.google/blog/rss.xml
    fallback_urls:
      - https://deepmind.google/discover/blog/
    max_entries: 25
    scrape:
      index_url: https://deepmind.google/discover/blog/
      link_prefix: /discover/blog/
    notes: |
      DeepMind research blog. deepmind.google is blocked at the
      Phison egress. Try the documented rss.xml first, then scrape
      the discover index.

  - source: minimax-news
    name: MiniMax News
    url: https://www.minimax.io/news
    fallback_urls: []
    max_entries: 25
    scrape:
      index_url: https://www.minimax.io/news
      link_prefix: /news/
    notes: |
      MiniMax announcements. Host intermittently blocked at the
      Phison egress (SNI-based filter — probes flip 200/000).
      Mirror makes it deterministic.
